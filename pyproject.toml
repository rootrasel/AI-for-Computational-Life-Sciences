[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-for-computational-life-sciences"
version = "0.1.0"
description = "Research-Grade Curriculum and Pipelines for AI/ML in the Life Sciences"
readme = "README.md"
authors = [{ name = "AI for Life Sciences Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "biopython>=1.81",
    "rdkit>=2023.09.1",
    "scanpy>=1.9.5",
    "anndata>=0.10.0",
    "networkx>=3.1",
    "transformers>=4.35.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
